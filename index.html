<html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cricket Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0d1b2a; --panel:#15293d; --line:#27425c;
  --ball:#c8102e; --ball-d:#9d0c24; --light:#f2f5f8; --muted:#8fa5ba;
  --win:#3ecf8e; --lose:#ff6b6b; --gold:#f2b705;
  --r:14px;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--night);color:var(--light);font-family:Inter,system-ui,sans-serif;min-height:100%}
body{padding:16px;max-width:820px;margin:auto}
h1{font-family:'Bebas Neue',sans-serif;font-size:2.6rem;letter-spacing:.04em;line-height:1}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{flex:1;padding:12px;border:1px solid var(--line);background:var(--panel);color:var(--light);border-radius:var(--r);font:600 .95rem Inter;cursor:pointer}
.tab[aria-selected=true]{background:var(--ball);border-color:var(--ball)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:600}
.bar span b{font-family:'Bebas Neue';font-size:1.6rem;font-weight:400;margin-left:4px}
.hidden{display:none!important}

/* Cards */
.table{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--light);color:#13222f;border-radius:var(--r);overflow:hidden;border:3px solid var(--light);display:flex;flex-direction:column}
.card.win{border-color:var(--win)} .card.lose{border-color:var(--lose)}
.who{font-size:.7rem;font-weight:700;padding:6px 10px;background:#13222f;color:var(--light)}
.ph{position:relative;aspect-ratio:1/1;background:linear-gradient(160deg,#2b5876,#0d1b2a);overflow:hidden;display:grid;place-items:center}
.ph span{font-family:'Bebas Neue';font-size:4rem;color:#ffffff55}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.back{background:repeating-linear-gradient(45deg,var(--ball),var(--ball) 10px,var(--ball-d) 10px,var(--ball-d) 20px)}
.nm{font-family:'Bebas Neue';font-size:1.5rem;padding:8px 10px 0;line-height:1.1}
.ct{font-size:.75rem;color:#51677a;padding:0 10px 6px}
.stat{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 10px;border:0;border-top:1px solid #d5dde5;background:transparent;font:600 .85rem Inter;color:inherit;text-align:left}
button.stat{cursor:pointer}
button.stat:hover{background:#e3eaf1}
.stat.pick{background:var(--gold)}
.stat b{font-size:1rem}
.msg{min-height:3rem;margin:14px 0 10px;text-align:center;font-weight:600}
.btn{display:block;margin:0 auto;padding:12px 28px;border:0;border-radius:999px;background:var(--ball);color:#fff;font:700 1rem Inter;cursor:pointer}
.btn:hover{background:var(--ball-d)}

/* Guess */
.guess{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.guess .ph{max-width:340px;margin:0 auto 12px;border-radius:var(--r)}
.guess .ph>*{transition:filter .5s}
.clue{min-height:2.4rem;text-align:center;color:var(--gold);font-size:.9rem;margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:14px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--night);color:var(--light);font:600 .95rem Inter;cursor:pointer}
.opt:disabled{opacity:.45;text-decoration:line-through;cursor:default}
.opt.ok{background:var(--win);color:#06281a;border-color:var(--win);text-decoration:none;opacity:1}
.end{text-align:center;padding:30px 10px}
.end h2{font-family:'Bebas Neue';font-size:2.4rem;font-weight:400}
.end p{color:var(--muted);margin:8px 0 18px}
footer{margin-top:28px;color:var(--muted);font-size:.75rem;text-align:center}
@media(max-width:420px){.nm{font-size:1.2rem}.stat{padding:8px 6px;font-size:.78rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>Cricket Arena</h1>
<p class="sub">Two games: Top Trumps and Guess the Player.</p>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="t1" aria-selected="true">Top Trumps</button>
  <button class="tab" role="tab" id="t2" aria-selected="false">Guess the Player</button>
</div>

<!-- TOP TRUMPS -->
<section id="trumps">
  <div class="bar"><span>Round <b id="rd">1</b>/6</span><span>You <b id="sy">0</b> : <b id="sc">0</b> Computer</span></div>
  <div class="table" id="table"></div>
  <p class="msg" id="msg"></p>
  <button class="btn hidden" id="next">Next round</button>
</section>

<!-- GUESS -->
<section id="guess" class="hidden">
  <div class="bar"><span>Player <b id="gi">1</b>/8</span><span>Score <b id="gs">0</b> &nbsp; Best <b id="gb">0</b></span></div>
  <div class="guess" id="gbox"></div>
</section>

<footer>Stats are approximate ODI career numbers. Photos load from the <code>img/</code> folder.</footer>

<script>
/* ---------- DATA ----------
   img: path to the player's photo (use free-license photos, e.g. from Wikimedia Commons). Initials show if there is no photo.
   Stats are approximate: verify them from a reliable source before publishing. */
const PLAYERS = [
 {n:"Sachin Tendulkar",c:"India",img:"img/tendulkar.jpg",runs:18426,avg:44.8,sr:86.2,hundreds:49,clue:"Mumbai's 'Master Blaster', 100 international centuries"},
 {n:"Virat Kohli",c:"India",img:"img/kohli.jpg",runs:14000,avg:58.2,sr:93.7,hundreds:51,clue:"Delhi's run machine, the king of chases"},
 {n:"MS Dhoni",c:"India",img:"img/dhoni.jpg",runs:10773,avg:50.6,sr:87.6,hundreds:10,clue:"Ranchi's 'Captain Cool', won all three ICC trophies"},
 {n:"Rohit Sharma",c:"India",img:"img/rohit.jpg",runs:11000,avg:49.0,sr:92.0,hundreds:32,clue:"Three double centuries in ODIs"},
 {n:"Ricky Ponting",c:"Australia",img:"img/ponting.jpg",runs:13704,avg:42.0,sr:80.4,hundreds:30,clue:"Aussie captain who won two World Cups"},
 {n:"Brian Lara",c:"West Indies",img:"img/lara.jpg",runs:10405,avg:40.5,sr:79.5,hundreds:19,clue:"Holds the Test record of 400*"},
 {n:"AB de Villiers",c:"South Africa",img:"img/abd.jpg",runs:9577,avg:53.5,sr:101.1,hundreds:25,clue:"'Mr. 360', ODI century in just 31 balls"},
 {n:"Jacques Kallis",c:"South Africa",img:"img/kallis.jpg",runs:11579,avg:44.4,sr:72.9,hundreds:17,clue:"One of the greatest all-rounders, 10,000+ runs and 250+ wickets"},
 {n:"Kumar Sangakkara",c:"Sri Lanka",img:"img/sangakkara.jpg",runs:14234,avg:42.0,sr:78.9,hundreds:25,clue:"Wicketkeeper-batter with 14,000+ ODI runs"},
 {n:"Viv Richards",c:"West Indies",img:"img/richards.jpg",runs:6721,avg:47.0,sr:90.2,hundreds:11,clue:"Famous for batting without a helmet, ruled the 1970s and 80s"},
 {n:"Babar Azam",c:"Pakistan",img:"img/babar.jpg",runs:6100,avg:56.7,sr:88.8,hundreds:19,clue:"Lahore's cover-drive specialist"},
 {n:"Shahid Afridi",c:"Pakistan",img:"img/afridi.jpg",runs:8064,avg:23.6,sr:117.0,hundreds:6,clue:"'Boom Boom', ODI century in 37 balls"}
];
const STATS = [["runs","Runs"],["avg","Average"],["sr","Strike rate"],["hundreds","Centuries"]];
const $ = id => document.getElementById(id);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };
const initials = n => n.split(" ").map(w=>w[0]).slice(0,2).join("");
const fmt = (k,v) => k==="runs" ? v.toLocaleString("en-IN") : (k==="hundreds" ? v : v.toFixed(1));
const photo = (p,txt,cls="") => `<div class="ph ${cls}"><span>${txt}</span><img src="${p.img}" alt="" onerror="this.remove()"></div>`;

/* ---------- TABS ---------- */
function show(which){
  $("trumps").classList.toggle("hidden", which!==1);
  $("guess").classList.toggle("hidden", which!==2);
  $("t1").setAttribute("aria-selected", which===1);
  $("t2").setAttribute("aria-selected", which===2);
  which===1 ? startTrumps() : startGuess();
}
$("t1").onclick = () => show(1);
$("t2").onclick = () => show(2);

/* ---------- TOP TRUMPS ---------- */
let deck, round, score, you, cpu, locked;
const ROUNDS = 6;

function cardHTML(p, who, o={}){
  if(o.hidden) return `<div class="card"><div class="who">${who}</div>${photo(p,"?","back")}<div class="nm">???</div><div class="ct">&nbsp;</div>${STATS.map(s=>`<div class="stat">${s[1]}<b>?</b></div>`).join("")}</div>`;
  const rows = STATS.map(([k,l])=>{
    const cls = "stat" + (o.pick===k ? " pick" : "");
    return o.click
      ? `<button class="${cls}" data-k="${k}">${l}<b>${fmt(k,p[k])}</b></button>`
      : `<div class="${cls}">${l}<b>${fmt(k,p[k])}</b></div>`;
  }).join("");
  return `<div class="card ${o.res||""}"><div class="who">${who}</div>${photo(p,initials(p.n))}<div class="nm">${p.n}</div><div class="ct">${p.c}</div>${rows}</div>`;
}

function startTrumps(){
  deck = shuffle(PLAYERS); round = 0; score = {y:0,c:0};
  $("sy").textContent = 0; $("sc").textContent = 0;
  nextRound();
}
function nextRound(){
  if(round >= ROUNDS) return endTrumps();
  you = deck[round*2]; cpu = deck[round*2+1]; locked = false;
  $("rd").textContent = round+1;
  $("table").innerHTML = cardHTML(you,"YOUR CARD",{click:true}) + cardHTML(cpu,"COMPUTER",{hidden:true});
  $("msg").textContent = "Pick a stat on your card.";
  $("next").classList.add("hidden");
  $("table").querySelectorAll("button.stat").forEach(b => b.onclick = () => play(b.dataset.k));
}
function play(k){
  if(locked) return; locked = true;
  const a = you[k], b = cpu[k];
  const r = a>b ? "win" : a<b ? "lose" : "tie";
  if(r==="win") score.y++; else if(r==="lose") score.c++;
  $("table").innerHTML = cardHTML(you,"YOUR CARD",{pick:k,res:r==="tie"?"":r}) + cardHTML(cpu,"COMPUTER",{pick:k,res:r==="win"?"lose":r==="lose"?"win":""});
  const l = STATS.find(s=>s[0]===k)[1];
  $("msg").textContent = r==="win" ? `You win! ${l}: ${fmt(k,a)} vs ${fmt(k,b)}` : r==="lose" ? `Computer wins. ${l}: ${fmt(k,a)} vs ${fmt(k,b)}` : `Draw! Both have the same ${l}.`;
  $("sy").textContent = score.y; $("sc").textContent = score.c;
  round++;
  $("next").textContent = round>=ROUNDS ? "See result" : "Next round";
  $("next").classList.remove("hidden");
}
$("next").onclick = nextRound;
function endTrumps(){
  const t = score.y>score.c ? "You won!" : score.y<score.c ? "Computer won" : "Match draw";
  $("table").innerHTML = `<div class="end" style="grid-column:1/-1"><h2>${t}</h2><p>Final score: ${score.y} - ${score.c}</p></div>`;
  $("msg").textContent = ""; $("next").textContent = "Play again";
  $("next").classList.remove("hidden");
  $("next").onclick = () => { $("next").onclick = nextRound; startTrumps(); };
}

/* ---------- GUESS THE PLAYER ---------- */
let gq, gidx, gscore, wrong, cur, best = 0;
const GROUNDS = 8, BLUR = [22,15,8];
try { best = +localStorage.getItem("arenaBest") || 0 } catch(e){}

function startGuess(){
  gq = shuffle(PLAYERS).slice(0, GROUNDS); gidx = 0; gscore = 0;
  $("gs").textContent = 0; $("gb").textContent = best;
  guessRound();
}
function guessRound(){
  if(gidx >= GROUNDS) return endGuess();
  cur = gq[gidx]; wrong = 0;
  $("gi").textContent = gidx+1;
  const others = shuffle(PLAYERS.filter(p=>p!==cur)).slice(0,3);
  const opts = shuffle([cur,...others]);
  $("gbox").innerHTML =
    `<div class="ph" id="gph"><span>?</span><img src="${cur.img}" alt="" onerror="this.remove()"></div>
     <p class="clue" id="clue">The photo is blurred. Guess early to earn more points (3, 2, 1).</p>
     <div class="opts">${opts.map(p=>`<button class="opt" data-n="${p.n}">${p.n}</button>`).join("")}</div>`;
  blur(BLUR[0]);
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b));
}
function blur(px){ document.querySelectorAll("#gph>*").forEach(e => e.style.filter = `blur(${px}px)`) }
function answer(b){
  if(b.dataset.n === cur.n){
    const pts = 3 - wrong; gscore += pts;
    $("gs").textContent = gscore;
    b.classList.add("ok"); blur(0);
    $("gph span").textContent = initials(cur.n);
    done(`Correct! ${cur.n}, ${cur.c}. +${pts} points`);
  } else {
    b.disabled = true; wrong++;
    if(wrong >= 3){
      document.querySelector(`.opt[data-n="${cur.n}"]`).classList.add("ok"); blur(0);
      done(`It was ${cur.n}. 0 points`);
    } else {
      blur(BLUR[wrong]);
      $("clue").textContent = "Hint: " + cur.clue;
    }
  }
}
function done(text){
  document.querySelectorAll(".opt").forEach(o => o.disabled = true);
  $("clue").textContent = text;
  const n = document.createElement("button");
  n.className = "btn"; n.style.marginTop = "14px";
  n.textContent = gidx+1>=GROUNDS ? "See result" : "Next player";
  n.onclick = () => { gidx++; guessRound(); };
  $("gbox").appendChild(n);
}
function endGuess(){
  const max = GROUNDS*3;
  if(gscore > best){ best = gscore; try{ localStorage.setItem("arenaBest", best) }catch(e){} }
  $("gb").textContent = best;
  $("gbox").innerHTML = `<div class="end"><h2>${gscore} / ${max}</h2><p>${gscore>=max*.75?"True cricket expert!":gscore>=max*.4?"Well played, keep practising.":"Better luck next time, learn the players."}</p><button class="btn" id="again">Play again</button></div>`;
  $("again").onclick = startGuess;
}

startTrumps();
</script>
</body>
</html>
